name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure (win32-release)
        run: cmake --preset win32-release

      - name: Build (win32-release)
        run: cmake --build --preset win32-release --config Release

      - name: Package (release-zip)
        working-directory: build/win32-release
        run: cpack --preset release-zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: build/win32-release/*.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: false
          generate_release_notes: true
